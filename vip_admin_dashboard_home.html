<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIP Admin Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* RESET & FONT */
*{margin:0;padding:0;box-sizing:border-box;font-family:'SF Pro Display',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;transition:all 0.3s ease;}
body{
    min-height:100vh;
    background:url('background.jpg') center/cover no-repeat fixed;
    display:flex;
    flex-direction:column;
    align-items:center;
    color:#000;
    position:relative;
}

/* CONTAINER VIP GLASS */
.dashboard-container{
    margin-top:80px; /* ruang untuk logout */
    width:90%;
    max-width:1000px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(25px);
    border-radius:25px;
    padding:40px;
    box-shadow:0 25px 60px rgba(0,0,0,0.4);
    animation: fadeIn 1s ease forwards;
    position:relative;
}

/* KEYFRAMES */
@keyframes fadeIn {from{opacity:0;transform:translateY(-20px);}to{opacity:1;transform:translateY(0);}}
@keyframes slideUp {from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}

.menu-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin-bottom:40px;
}
.menu-box{
    background:rgba(255,255,255,0.2);
    backdrop-filter:blur(15px);
    padding:40px 0;
    text-align:center;
    border-radius:15px;
    cursor:pointer;
    font-size:1.5rem;
    font-weight:600;
    transition:0.4s;
    border:2px solid rgba(0,0,0,0.3); /* garis tegas */
}
.menu-box:hover{
    transform:translateY(-8px) scale(1.05);
    box-shadow:0 0 25px rgba(0,255,255,0.6);
}
.menu-box.active{
    background: rgba(0,122,255,0.7);
    color: #fff;
    border:2px solid rgba(0,122,255,0.8);
    box-shadow:0 0 30px rgba(0,122,255,0.8);
}

/* FORM SECTION */
.form-section{
    display:none;
    animation: slideUp 0.8s ease forwards;
}
.form-section.active{
    display:block;
}
.input-group{
    margin-bottom:20px;
    animation: slideUp 0.8s ease forwards;
}
.input-group input,
.input-group textarea{
    width:100%;
    padding:15px;
    margin:8px 0;
    border-radius:12px;
    border:none;
    font-size:1rem;
    color:#000;
}
.input-group button{
    width:100%;
    padding:15px;
    border-radius:30px;
    border:none;
    font-weight:bold;
    cursor:pointer;
    background:linear-gradient(135deg,#007aff,#00c6ff);
    color:#fff;
    transition:0.3s;
}
.input-group button:hover{
    transform:scale(1.05);
    box-shadow:0 0 20px rgba(0,122,255,0.6);
}

/* POST LIST */
.post-list{
    margin-top:30px;
}
.post-item{
    background:rgba(255,255,255,0.2);
    padding:20px;
    margin:15px 0;
    border-radius:15px;
    animation: slideUp 0.6s ease forwards;
}
.post-item button{
    margin-top:10px;
    margin-right:10px;
    padding:8px 15px;
    border:none;
    border-radius:20px;
    cursor:pointer;
    transition:0.3s;
}
.post-item button:hover{
    transform:scale(1.05);
}

/* LOGOUT BUTTON POJOK KIRI ATAS */
.logout-btn{
    position:absolute;
    top:20px;
    left:20px;
    padding:10px 20px;
    border-radius:25px;
    border:none;
    background:#ff4d4d;
    color:#fff;
    cursor:pointer;
    font-weight:bold;
    z-index:1000;
    transition:0.3s;
}
.logout-btn:hover{
    transform:scale(1.05);
    box-shadow:0 0 25px rgba(255,77,77,0.6);
}

/* FOOTER */
footer{
    margin-top:30px;
    text-align:center;
    font-size:0.9rem;
}
</style>
</head>
<body>

<!-- LOGOUT -->
<button class="logout-btn" onclick="logout()">Log Out</button>

<div class="dashboard-container">
<h2 style="text-align:center;margin-bottom:30px;">👑 VIP Admin Dashboard</h2>

<!-- MENU GRID -->
<div class="menu-grid">
    <div class="menu-box" onclick="showForm('A')">Kategori A</div>
    <div class="menu-box" onclick="showForm('B')">Kategori B</div>
    <div class="menu-box" onclick="showForm('C')">Kategori C</div>
    <div class="menu-box" onclick="showForm('D')">Kategori D</div>
    <div class="menu-box" onclick="showForm('E')">Kategori E</div>
    <div class="menu-box" onclick="showForm('F')">Kategori F</div>
</div>

<!-- FORM SECTION -->
<div class="form-section" id="formSection">
    <div class="input-group">
        <input type="text" id="tokenInput" placeholder="Masukkan Token untuk Akses Kategori">
        <button onclick="setToken()">Setel Token</button>
    </div>
    <div class="input-group">
        <input type="text" id="postTitle" placeholder="Judul Postingan">
        <textarea id="postContent" placeholder="Isi Postingan"></textarea>
        <textarea id="postLinks" placeholder="Masukkan link (Enter untuk pisah)"></textarea>
        <button onclick="createPost()">Buat Postingan</button>
    </div>

    <div class="post-list" id="postList"></div>
</div>

</div>

<footer>&copy; 2026 @nipo VIP Edition</footer>

<script>
// DATA POSTS & TOKENS
let posts = JSON.parse(localStorage.getItem('posts')) || [];
let tokens = {
    A: 'tokenA123',
    B: 'tokenB123',
    C: 'tokenC123',
    D: 'tokenD123',
    E: 'tokenE123',
    F: 'tokenF123'
};
let currentCategory = null;

// SHOW FORM & FILTER POSTS PER KATEGORI
function showForm(category){
    currentCategory = category;
    document.getElementById("formSection").classList.add("active");
    document.getElementById("postList").innerHTML = "";

    // Highlight kotak aktif
    document.querySelectorAll('.menu-box').forEach(box => {
        box.classList.toggle('active', box.textContent.includes(category));
    });

    // Tampilkan postingan kategori terpilih
    const filteredPosts = posts.filter(post => post.category === category);
    filteredPosts.forEach(post => addPostToList(post));
}

// SET TOKEN FOR CATEGORY
function setToken() {
    const token = document.getElementById('tokenInput').value;
    if (token === '') {
        alert('Token tidak boleh kosong!');
        return;
    }

    // Store token in localStorage
    localStorage.setItem(`token${currentCategory}`, token);

    alert(`Token untuk kategori ${currentCategory} telah diperbarui!`);
    
    // Clear input token setelah diatur
    document.getElementById('tokenInput').value = '';
}

// CREATE POST
function createPost(){
    const title = document.getElementById('postTitle').value;
    const content = document.getElementById('postContent').value;
    const links = document.getElementById('postLinks').value.split('\n');

    if(title === '' || content === '') {
        alert("Judul dan Isi harus diisi!");
        return;
    }
    if(!currentCategory){
        alert("Pilih kategori dulu!");
        return;
    }

    const newPost = { title, content, links, category: currentCategory };
    posts.push(newPost);
    localStorage.setItem('posts', JSON.stringify(posts));
    addPostToList(newPost);

    document.getElementById('postTitle').value = '';
    document.getElementById('postContent').value = '';
    document.getElementById('postLinks').value = '';
}

// ADD POST TO LIST
function addPostToList(post){
    const postList = document.getElementById('postList');
    const postElement = document.createElement('div');
    postElement.classList.add('post-item');
    postElement.innerHTML = `
        <h3>${post.title}</h3>
        <div>${post.content}</div>
        <div>${post.links.join(', ')}</div>
        <button onclick="deletePost(this)">Hapus</button>
        <button onclick="editPost(this)">Edit</button>
    `;
    postList.appendChild(postElement);
}

// DELETE POST
function deletePost(button){
    const postItem = button.parentElement;
    const postTitle = postItem.querySelector('h3').textContent;

    posts = posts.filter(p => !(p.title === postTitle && p.category === currentCategory));
    localStorage.setItem('posts', JSON.stringify(posts));
    postItem.remove();
}

// EDIT POST
function editPost(button){
    const postItem = button.parentElement;
    const postTitle = postItem.querySelector('h3').textContent;
    const postContent = postItem.querySelector('div').textContent;

    // Isi form dengan data dari postingan yang dipilih
    document.getElementById('postTitle').value = postTitle;
    document.getElementById('postContent').value = postContent;
    
    // Hapus postingan yang diedit dari list
    posts = posts.filter(p => !(p.title === postTitle && p.category === currentCategory));
    localStorage.setItem('posts', JSON.stringify(posts));
    postItem.remove();
}

// LOGOUT
function logout(){ 
    window.location.href = 'utama.html'; 
}
</script>

</body>
</html>
