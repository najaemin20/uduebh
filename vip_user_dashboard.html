<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free User Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'SF Pro Display', sans-serif;
            transition: all 0.3s ease;
        }

        body {
            min-height: 100vh;
            background: url('background.jpg') center/cover no-repeat fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #000;
        }

        .dashboard-container {
            margin-top: 50px;
            width: 90%;
            max-width: 1000px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(25px);
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.8s ease forwards;
            position: relative;
            z-index: 2;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .menu-box {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            padding: 30px 0;
            text-align: center;
            border-radius: 15px;
            cursor: pointer;
            font-size: 1.5rem;
            font-weight: 600;
            transition: 0.4s;
            border: 2px solid rgba(0, 0, 0, 0.3);
        }

        .menu-box:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.6);
        }

        /* Token Input Card */
        .token-card {
            background: rgba(255, 255, 255, 0.8);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            width: 60%;
            margin: 20px auto;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
        }

        .token-input {
            padding: 15px;
            font-size: 1.2rem;
            border-radius: 10px;
            border: 1px solid #ccc;
            width: 80%;
            margin-bottom: 10px;
        }

        .token-button {
            padding: 15px;
            background-color: #007aff;
            border: none;
            border-radius: 25px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .token-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 122, 255, 0.6);
        }

        /* Post List */
        .post-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
            opacity: 0;
            transform: translateY(20px);
            transition: 0.5s;
        }

        .post-list.show {
            opacity: 1;
            transform: translateY(0);
        }

        .post-item {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 15px;
            transition: 0.3s;
            border: 2px solid rgba(0, 0, 0, 0.2);
            cursor: pointer;
        }

        .post-item:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 0 20px rgba(0, 122, 255, 0.6);
        }

        /* Search */
        .search-container {
            margin-top: 20px;
            display: none;
        }

        .search-container input {
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            border-radius: 15px;
            border: 1px solid #ccc;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

<!-- Dashboard Container -->
<div class="dashboard-container" id="dashboardContainer">
    <h2 style="text-align:center; margin-bottom:30px;">📌 Free User Dashboard</h2>

    <!-- Category Boxes -->
    <div class="menu-grid" id="categoryBoxes">
        <div class="menu-box" onclick="showTokenCard('A')">Kategori A</div>
        <div class="menu-box" onclick="showTokenCard('B')">Kategori B</div>
        <div class="menu-box" onclick="showTokenCard('C')">Kategori C</div>
        <div class="menu-box" onclick="showTokenCard('D')">Kategori D</div>
        <div class="menu-box" onclick="showTokenCard('E')">Kategori E</div>
        <div class="menu-box" onclick="showTokenCard('F')">Kategori F</div>
    </div>

    <!-- Token Input Card (Initially Hidden) -->
    <div id="tokenCard" class="token-card" style="display: none;">
        <h3>Masukkan Token untuk Kategori <span id="tokenCategory"></span></h3>
        <input type="text" id="tokenInput" class="token-input" placeholder="Masukkan Token">
        <button class="token-button" onclick="verifyToken()">Verifikasi Token</button>
        <p id="tokenError" style="color: red; display: none;">Token salah. Coba lagi.</p>
    </div>

    <!-- Search (Moved to Top) -->
    <div class="search-container" id="searchContainer">
        <input type="text" id="searchInput" placeholder="Cari Postingan..." onkeyup="searchPosts()">
    </div>

    <!-- Post List (Initially Hidden) -->
    <div class="post-list" id="postList"></div>

</div>

<footer>&copy; 2026 @nipo Free Edition</footer>

<script>
// Simulasi Data Posts dan Token
let posts = JSON.parse(localStorage.getItem('posts')) || [];
let currentCategory = null;
let currentToken = null;

// Fungsi untuk menampilkan postingan berdasarkan kategori
function renderPosts(postArray) {
    const postList = document.getElementById('postList');
    postList.innerHTML = '';
    if (postArray.length === 0) {
        postList.innerHTML = '<p>Belum ada postingan di kategori ini.</p>';
        return;
    }
    postArray.forEach(post => {
        const div = document.createElement('div');
        div.classList.add('post-item');
        div.innerHTML = `<h3>${post.title}</h3><p>${post.content}</p>`;
        div.onclick = () => window.location.href = `post_detail_vip.html?title=${encodeURIComponent(post.title)}`;
        postList.appendChild(div);
    });
    postList.classList.add('show');
}

// Menampilkan card untuk input token
function showTokenCard(category) {
    currentCategory = category;
    currentToken = localStorage.getItem(`token${category}`); // Mengambil token kategori dari localStorage
    document.getElementById('tokenCategory').innerText = category;
    document.getElementById('tokenCard').style.display = 'block'; // Menampilkan card
    document.getElementById('categoryBoxes').style.display = 'none'; // Menyembunyikan kategori
}

// Verifikasi token yang dimasukkan oleh user
function verifyToken() {
    const inputToken = document.getElementById('tokenInput').value;

    if (inputToken === currentToken) {
        filterPosts(currentCategory); // Menampilkan kategori setelah token benar
        document.getElementById('tokenCard').style.display = 'none'; // Menyembunyikan card setelah token benar
        document.getElementById('searchContainer').style.display = 'block'; // Menampilkan kotak pencarian
    } else {
        document.getElementById('tokenError').style.display = 'block'; // Menampilkan error jika token salah
    }
}

// Menampilkan postingan berdasarkan kategori
function filterPosts(category) {
    const filtered = posts.filter(p => p.category === category);
    renderPosts(filtered);
}

// Pencarian Postingan
function searchPosts() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const filteredPosts = posts.filter(post =>
        post.category === currentCategory &&
        (post.title.toLowerCase().includes(query) || post.content.toLowerCase().includes(query))
    );
    renderPosts(filteredPosts);
}
</script>

</body>
</html>
